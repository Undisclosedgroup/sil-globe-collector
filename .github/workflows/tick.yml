# Globe collector tick — DISABLED 2026-09-03. This job has been running
# redundantly in parallel with sil-globe-collector.service on Phoenix
# (216.152.151.3) since that systemd deployment went live ~2026-07-31 (see
# github.com/undisclozed/sil-globe-collector's DEPLOY.md) — nobody turned
# this schedule off after the migration, so it kept costing real Actions
# minutes (~$193/mo net across two billing periods, plus this job was
# failing on every recent run from proxy access breaking on GH's ephemeral
# runner IPs) for no benefit; the real collector on Phoenix has been the
# one actually feeding the dashboard this whole time. Kept as
# workflow_dispatch-only for manual reruns / as a documented rollback path.
#
# Free tier note: this repo is PUBLIC so GitHub Actions minutes are free
# and unlimited — even so, this run cost real money; see the note above.

name: tick
on:
  workflow_dispatch:        # manual "Run workflow" button — schedule removed, see note above

# Don't pile up runs if a previous tick is still going.
concurrency:
  group: globe-collector-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 25       # well under the 5-min cron interval after build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system deps for shapely / pyproj / lxml
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libproj-dev proj-data proj-bin \
            libgeos-dev \
            libxml2-dev libxslt1-dev

      - name: Install Python deps
        run: pip install --no-cache-dir -r requirements.txt

      # Restore the kinetic-detector state across runs so each tick warms
      # the per-cell Z-score baselines instead of cold-starting (the daemon
      # gets this for free via the ~/Library/Caches/sil-globe pickle).
      - name: Restore kinetic state
        uses: actions/cache@v4
        with:
          path: kinetic_state.pkl
          key: kinetic-state-${{ github.run_id }}
          restore-keys: |
            kinetic-state-

      - name: Debug secret presence
        env:
          WEBSHARE_POOL_B64: ${{ secrets.WEBSHARE_POOL_B64 }}
          PROXYRACK_USERNAME: ${{ secrets.PROXYRACK_USERNAME }}
        run: |
          echo "WEBSHARE_POOL_B64 length: ${#WEBSHARE_POOL_B64}"
          echo "PROXYRACK_USERNAME length: ${#PROXYRACK_USERNAME}"

      - name: Run tick
        env:
          # Webshare datacenter pool — ProxyRack residential refuses CONNECT
          # from GH Actions IPs, so the collector's proxy_fetcher swaps to
          # Webshare when WEBSHARE_POOL_B64 is set. ProxyRack creds stay
          # in env as harmless fallback for the daemon-mode collector.
          WEBSHARE_POOL_B64: ${{ secrets.WEBSHARE_POOL_B64 }}
          PROXYRACK_HOST: ${{ secrets.PROXYRACK_HOST }}
          PROXYRACK_PORT: ${{ secrets.PROXYRACK_PORT }}
          PROXYRACK_USERNAME: ${{ secrets.PROXYRACK_USERNAME }}
          PROXYRACK_PASSWORD: ${{ secrets.PROXYRACK_PASSWORD }}
          PROXYRACK_PROXY_URL: ${{ secrets.PROXYRACK_PROXY_URL }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          GFW_API_KEY: ${{ secrets.GFW_API_KEY }}
          CLOUDFLARE_RADAR_TOKEN: ${{ secrets.CLOUDFLARE_RADAR_TOKEN }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          WSDOT_ACCESS_CODE: ${{ secrets.WSDOT_ACCESS_CODE }}
        run: python -u tick.py
