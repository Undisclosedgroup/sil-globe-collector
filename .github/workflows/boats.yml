# Boats AISStream daemon — DISABLED 2026-09-03. Migrated to
# sil-globe-boats.service on Phoenix (216.152.151.3), running under
# systemd Restart=always alongside sil-globe-collector.service (which has
# been running there since ~2026-07-31 — see undisclozed/sil-globe-collector's
# DEPLOY.md). Verified live: globe/boats.json got a fresh Vercel Blob write
# ~30s after the systemd service started. Kept as workflow_dispatch-only
# for manual reruns / rollback.
#
# AISStream's only access pattern is a persistent WebSocket; there's no REST
# snapshot. Each job here connects to the WS, accumulates per-MMSI vessel
# state, and writes `globe/boats.json` to Vercel Blob every 30s.
#
# Public repo => free unlimited minutes, in theory — see the recent billing
# audit for why that didn't hold in practice.

name: boats
on:
  workflow_dispatch:

concurrency:
  # Never run two boats daemons simultaneously — they'd both write the
  # same blob and double-burn AISStream's per-key rate budget.
  group: boats-daemon
  cancel-in-progress: false

jobs:
  daemon:
    runs-on: ubuntu-latest
    timeout-minutes: 355   # 5h 55m — under GitHub's 6h job ceiling
    permissions:
      # repository_dispatch (POST /dispatches) needs contents:write.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python deps
        # boats only needs websockets + certifi + curl_cffi (for blob_put).
        # Skip the heavy shapely/pyproj/lxml that tick.py needs.
        run: |
          pip install --no-cache-dir \
            "websockets>=12.0" "certifi>=2024.2.2" "curl_cffi>=0.6" \
            "requests>=2.32"

      - name: Run boats daemon (5h 50m, then exit)
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: python -u boats_daemon.py

      - name: Chain next run
        # Self-chain so the next 5h50m job starts within ~30s (vs the 6h
        # schedule gap). NOTE: GitHub's GITHUB_TOKEN cannot trigger a new
        # workflow run via repository_dispatch (recursion guard) — so real
        # self-chaining needs a PAT. Add a `BOATS_CHAIN_PAT` secret (repo:write)
        # to enable it; without it this is a no-op and the 6h `schedule`
        # trigger restarts boats (≤~10min gap). Non-fatal either way so the
        # run never shows red on a dispatch hiccup.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.BOATS_CHAIN_PAT || github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ -n "${{ secrets.BOATS_CHAIN_PAT }}" ]; then
            gh api -X POST "repos/$REPO/dispatches" -f event_type=boats-chain \
              && echo "chained next boats run via repository_dispatch" \
              || echo "chain dispatch failed; relying on the 6h schedule"
          else
            echo "no BOATS_CHAIN_PAT secret — self-chaining disabled; 6h schedule restarts boats"
          fi
